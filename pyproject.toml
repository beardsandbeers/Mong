[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mong"
version = "0.1.0"
description = "Admin UI and client for a local NoMongo-T (standalone mongot) server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=30.0",
    "flask>=3.0",
    # 0.11.0 is distributed on GitHub; PyPI currently stops at 0.10.0.
    "mongot-standalone-client @ https://github.com/beardsandbeers/nomongo-t/releases/download/standalone-v0.11.0/mongot_standalone_client-0.11.0-py3-none-any.whl#sha256=7e9195a214318dce2092d64dba3f10a8305e8c2058f9da6dcf1c9c25c7f18e90",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pymongo>=4.6",
]
mongod = [
    "pymongo>=4.6",
]

[project.scripts]
mong = "mong.__main__:main"
mong-admin = "mong.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mong = ["web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
