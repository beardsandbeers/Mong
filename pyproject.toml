[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mong"
version = "0.1.0"
description = "Admin UI and client for a local NoMongo-T (standalone mongot) server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=30.0",
    "flask>=3.0",
    "mongot-standalone-client==0.5.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mong = "mong.__main__:main"
mong-admin = "mong.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mong = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
